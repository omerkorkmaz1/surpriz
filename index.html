<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sana Bir Şey Söylemeliyim...</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #000;
            color: #fff;
            overflow: hidden;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        #starsCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0;
            transition: opacity 2s ease-in-out;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 400px;
        }

        .step-box {
            background: rgba(20, 20, 20, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px 20px;
            border-radius: 24px;
            width: 100%;
            transition: opacity 1s ease, transform 1s ease;
        }

        h2 {
            font-size: 24px;
            margin-bottom: 30px;
            font-weight: 500;
            letter-spacing: 1px;
            color: #fff;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            min-height: 80px;
        }

        button {
            padding: 14px 28px;
            font-size: 18px;
            font-weight: 500;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        #yesBtn {
            background-color: #fff;
            color: #000;
            z-index: 2;
        }

        #noBtn {
            background-color: #222;
            color: #888;
            border: 1px solid #333;
        }

        /* Papatya Buketine Özel Tasarım Ayarı */
        .bouquet-scene {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            opacity: 0;
            transition: opacity 2s ease-in-out;
        }

        .bouquet-img {
            width: 320px; /* Papatya buketinin daha yayvan yapısına uyumlu */
            height: auto;
            max-height: 400px;
            object-fit: contain;
            filter: drop-shadow(0 0 40px rgba(255, 255, 255, 0.2)); /* Şık ve hafif bir dış ışıltı */
            margin-bottom: 25px;
            opacity: 0;
            transform: translateY(20px);
            transition: all 2s ease-out;
        }

        .cinematic-text {
            font-size: 22px;
            font-weight: 300;
            letter-spacing: 2px;
            color: #fff;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
            opacity: 0;
            transform: translateY(10px);
            transition: all 2s ease-out 1s;
        }

        .hidden {
            display: none !important;
        }

        .fade-out {
            opacity: 0 !important;
            transform: scale(0.9) !important;
            pointer-events: none;
        }

        .fade-in {
            opacity: 1 !important;
            transform: translateY(0) !important;
        }
    </style>
</head>
<body>

    <canvas id="starsCanvas"></canvas>

    <div class="container">
        <div class="step-box" id="questionBox">
            <h2 id="questionText">Beni seviyor musun?</h2>
            <div class="btn-group">
                <button id="yesBtn" onclick="handleYes()">Evet</button>
                <button id="noBtn" onclick="handleNo()">Hayır</button>
            </div>
        </div>

        <div class="bouquet-scene" id="bouquetScene">
            <!-- DİKKAT: Yüklediğin resmin adı farklıysa aşağıdaki cicek.png kısmını değiştirmelisin -->
            <img src="IMG_5486.png" class="bouquet-img" id="bouquetImage" alt="Papatya Buketi">
            <div class="cinematic-text" id="cinematicText">Dünyanın en güzel çiçeğine...</div>
        </div>
    </div>

    <script>
        let noClickCount = 0;
        let stage = 1; 
        
        const noMessages = [
            "Hayır",
            "Emin misin?",
            "Bir daha düşün...",
            "Kalbimi kırıyorsun",
            "Son kararın mı?",
            "Tıklama şuna",
            "İnat etme :)",
            "Mecbur evet diyeceksin"
        ];

        const canvas = document.getElementById('starsCanvas');
        const ctx = canvas.getContext('2d');
        let stars = [];

        function initStars() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            stars = [];
            for (let i = 0; i < 200; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    radius: Math.random() * 1.5,
                    alpha: Math.random(),
                    speed: Math.random() * 0.02 + 0.005
                });
            }
        }

        function drawStars() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            stars.forEach(star => {
                star.alpha += star.speed;
                if (star.alpha > 1 || star.alpha < 0) {
                    star.speed = -star.speed;
                }
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${star.alpha})`;
                ctx.fill();
            });
            requestAnimationFrame(drawStars);
        }

        window.addEventListener('resize', initStars);
        initStars();
        drawStars();

        function handleNo() {
            noClickCount++;
            const yesBtn = document.getElementById('yesBtn');
            const noBtn = document.getElementById('noBtn');
            
            let currentSize = 18 + (noClickCount * 4);
            let currentPaddingV = 14 + (noClickCount * 3);
            let currentPaddingH = 28 + (noClickCount * 5);
            
            yesBtn.style.fontSize = currentSize + 'px';
            yesBtn.style.padding = `${currentPaddingV}px ${currentPaddingH}px`;

            if (noClickCount < noMessages.length) {
                noBtn.innerText = noMessages[noClickCount];
            } else {
                noBtn.style.display = 'none'; 
            }
        }

        function handleYes() {
            const questionBox = document.getElementById('questionBox');
            const bouquetScene = document.getElementById('bouquetScene');
            const bouquetImage = document.getElementById('bouquetImage');
            const cinematicText = document.getElementById('cinematicText');
            const starsCanvas = document.getElementById('starsCanvas');

            if (stage === 1) {
                questionBox.classList.add('fade-out');
                
                setTimeout(() => {
                    questionBox.style.display = 'none';
                    starsCanvas.style.opacity = '1';
                    
                    bouquetScene.style.display = 'flex';
                    setTimeout(() => {
                        bouquetScene.style.opacity = '1';
                        bouquetImage.classList.add('fade-in');
                        cinematicText.classList.add('fade-in');
                    }, 500);

                    setTimeout(() => {
                        bouquetScene.style.opacity = '0';
                        bouquetImage.classList.remove('fade-in');
                        cinematicText.classList.remove('fade-in');
                        
                        setTimeout(() => {
                            bouquetScene.style.display = 'none';
                            
                            document.getElementById('questionText').innerText = "Peki beni affettin mi?";
                            document.getElementById('noBtn').style.display = 'inline-block';
                            document.getElementById('noBtn').innerText = "Hayır";
                            
                            const yesBtn = document.getElementById('yesBtn');
                            yesBtn.style.fontSize = '18px';
                            yesBtn.style.padding = '14px 28px';
                            noClickCount = 0;
                            stage = 2;
                            
                            questionBox.style.display = 'block';
                            setTimeout(() => {
                                questionBox.classList.remove('fade-out');
                            }, 50);

                        }, 2000);
                    }, 6000); 

                }, 1000);

            } else if (stage === 2) {
                questionBox.classList.add('fade-out');
                
                setTimeout(() => {
                    questionBox.style.display = 'none';
                    cinematicText.innerHTML = "Biliyordum...<br><br>Seni çok seviyorum ❤️";
                    
                    bouquetScene.style.display = 'flex';
                    setTimeout(() => {
                        bouquetScene.style.opacity = '1';
                        bouquetImage.classList.add('fade-in');
                        cinematicText.classList.add('fade-in');
                    }, 500);
                }, 1000);
            }
        }
    </script>
</body>
</html>
