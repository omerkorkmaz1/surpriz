<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sana Bir Şey Söylemeliyim...</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #000;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            text-align: center;
            color: #fff;
        }

        /* Yıldızlar için Canvas */
        #starsCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0;
            transition: opacity 2s ease-in-out;
            pointer-events: none;
        }

        /* Ana İçerik Konteyneri */
        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 400px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .step-box {
            background: rgba(20, 20, 20, 0.6);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px 20px;
            border-radius: 24px;
            width: 100%;
            transition: opacity 1s ease, transform 1s ease;
        }

        h2 {
            font-size: 24px;
            margin-bottom: 30px;
            font-weight: 500;
            letter-spacing: 1px;
            color: #f8f8f8;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            position: relative;
            min-height: 80px;
        }

        button {
            padding: 14px 28px;
            font-size: 18px;
            font-weight: 500;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        #yesBtn {
            background-color: #fff;
            color: #000;
            z-index: 2;
        }

        #noBtn {
            background-color: #222;
            color: #888;
            border: 1px solid #333;
            position: relative;
        }

        /* Gerçek Çiçek Buketi Alanı */
        .bouquet-scene {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            opacity: 0;
            transition: opacity 2s ease-in-out;
        }

        .bouquet-img {
            width: 280px;
            height: 380px;
            object-fit: cover;
            border-radius: 20px;
            box-shadow: 0 0 50px rgba(255, 105, 180, 0.3), 0 0 100px rgba(255, 255, 255, 0.1);
            margin-bottom: 25px;
            opacity: 0;
            transform: translateY(20px);
            transition: all 2s ease-out;
        }

        .cinematic-text {
            font-size: 22px;
            font-weight: 300;
            letter-spacing: 2px;
            color: #fff;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
            opacity: 0;
            transform: translateY(10px);
            transition: all 2s ease-out 1s; /* Yazı çiçekten 1 saniye sonra gelsin */
        }

        .hidden {
            display: none !important;
        }

        .fade-out {
            opacity: 0 !important;
            transform: scale(0.9) !important;
            pointer-events: none;
        }

            opacity: 1
