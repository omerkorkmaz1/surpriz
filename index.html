<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sana Bir Şey Söylemeliyim...</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 99%, #fad0c4 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            text-align: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 350px;
            position: relative;
            z-index: 10;
        }

        h2 {
            color: #d63384;
            font-size: 24px;
            margin-bottom: 30px;
            font-weight: 700;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            position: relative;
            min-height: 80px;
        }

        button {
            padding: 12px 25px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        #yesBtn {
            background-color: #28a745;
            color: white;
            z-index: 2;
        }

        #noBtn {
            background-color: #dc3545;
            color: white;
            position: relative;
        }

        /* Çiçek Şöleni / Konfeti Canvas */
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        .hidden {
            display: none !important;
        }

        /* Sonuç Yazısı */
        #messageArea {
            font-size: 22px;
            color: #ff3366;
            font-weight: bold;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <canvas id="fireworks"></canvas>

    <div class="container" id="cardContainer">
        <!-- 1. Aşama: Beni seviyor musun? -->
        <div id="step1">
            <h2 id="questionText">Beni seviyor musun? ❤️</h2>
            <div class="btn-group">
                <button id="yesBtn" onclick="handleYes()">Evet</button>
                <button id="noBtn" onclick="handleNo()">Hayır</button>
            </div>
        </div>
    </div>

    <script>
        let noClickCount = 0;
        let stage = 1; // 1: Beni seviyor musun?, 2: Affettin mi?
        
        const noMessages = [
            "Hayır",
            "Emin misin? 🥺",
            "Yazıklar olsun ama! 😢",
            "Tekrar düşün bence...",
            "Bak vururum gücenirim!",
            "Tıklama o hayıra artıkkk!",
            "Şaka yapıyorsun kesin 🙄",
            "Seviyorsun işte uzatma üsteleme :)"
        ];

        function handleNo() {
            noClickCount++;
            const yesBtn = document.getElementById('yesBtn');
            const noBtn = document.getElementById('noBtn');
            
            // Evet butonunu büyüt
            let currentSize = 18 + (noClickCount * 6);
            let currentPaddingV = 12 + (noClickCount * 3);
            let currentPaddingH = 25 + (noClickCount * 5);
            
            yesBtn.style.fontSize = currentSize + 'px';
            yesBtn.style.padding = `${currentPaddingV}px ${currentPaddingH}px`;

            // Hayır butonunun yazısını değiştir
            if (noClickCount < noMessages.length) {
                noBtn.innerText = noMessages[noClickCount];
            } else {
                // Hayır butonunu tamamen ortadan kaldır, kaçacak yer bırakma :)
                noBtn.style.display = 'none';
            }
        }

        function handleYes() {
            if (stage === 1) {
                // Birinci aşama (Sevgi) bitti, kutlama ve 2. aşamaya geçiş
                startCelebration();
                
                setTimeout(() => {
                    document.getElementById('questionText').innerText = "Beni affettin mi? 🥹";
                    document.getElementById('noBtn').style.display = 'inline-block';
                    document.getElementById('noBtn').innerText = "Hayır";
                    const yesBtn = document.getElementById('yesBtn');
                    yesBtn.style.fontSize = '18px';
                    yesBtn.style.padding = '12px 25px';
                    noClickCount = 0;
                    stage = 2;
                }, 3000); // 3 saniye çiçek şöleni sürsün sonra affettin mi gelsin
            } else if (stage === 2) {
                // İkinci aşama (Af) bitti, final kutlaması
                startCelebration();
                document.getElementById('cardContainer').innerHTML = `
                    <div id="messageArea">Biliyordum! Seni çok ama çok seviyorum ❤️🌸</div>
                    <p style="color: #666; font-size: 16px;">İyi ki varsın sevgilim...</p>
                `;
            }
        }

        // iPhone ve tüm ekranlar için optimize edilmiş basit çiçek/kalp yağmuru (Canvas)
        function startCelebration() {
            const canvas = document.getElementById('fireworks');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            let particles = [];
            const symbols = ['❤️', '🌸', '💐', '🌷', '✨', '💖'];

            for (let i = 0; i < 50; i++) {
                particles.pages = {
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    symbol: symbols[Math.floor(Math.random() * symbols.length)],
                    speed: Math.random() * 3 + 2,
                    size: Math.random() * 20 + 10,
                    angle: Math.random() * 2 - 1
                };
            }

            // Daha temiz bir emoji animasyon döngüsü
            let animationFrame;
            let count = 0;

            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                particles.forEach((p, index) => {
                    ctx.font = `${p.size}px Arial`;
                    ctx.fillText(p.symbol, p.x, p.y);
                    p.y += p.speed;
                    p.x += p.angle;

                    if (p.y > canvas.height) {
                        p.y = -20;
                        p.x = Math.random() * canvas.width;
                    }
                });

                count++;
                if (count < 150) {
                    animationFrame = requestAnimationFrame(draw);
                } else {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }
            }
            draw();
        }
    </script>
</body>
</html>
